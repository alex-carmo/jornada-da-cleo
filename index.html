<style>
/* Layout: um console portátil — tela em cima, direcional + A/B embaixo; em paisagem baixa, controles nas laterais. Visual único (escuro) por escolha. */
:root{
  --bg:#1b1428;
  --shell:#3b2b57;
  --shell-hi:#54407a;
  --bezel:#130d1c;
  --ink:#f6efff;
  --muted:#b7a6d6;
  --pad:#261d3a;
  --pad-on:#4a3a6c;
  --btn-a:#e8589a;
  --btn-b:#8b76b8;
  --font-pixel:"Press Start 2P", ui-monospace, "Courier New", monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{
  background:var(--bg);color:var(--ink);font-family:var(--font-pixel);
  margin:0;padding-inline:16px;padding-block:12px;box-sizing:border-box;
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;touch-action:manipulation;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
}
.console{
  display:grid;grid-template-columns:1fr 1fr;
  grid-template-areas:"label label" "screen screen" "dpad ab" "hint hint";
  gap:18px 12px;align-items:center;
  width:min(100%,540px,calc((100dvh - 270px) * 1.5 + 60px));
  min-width:0;box-sizing:border-box;
  padding:16px 18px 22px;
  background:linear-gradient(165deg,var(--shell-hi),var(--shell) 55%);
  border-radius:16px 16px 48px 16px;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.14),inset 0 -5px 0 rgba(0,0,0,.28),0 24px 60px rgba(0,0,0,.5);
}
.label{
  grid-area:label;justify-self:start;font-size:9px;letter-spacing:.12em;
  background:linear-gradient(90deg,#ff8fb8,#ffd66e,#8ff0b0,#7fc8ff,#c69bff,#ff8fb8);
  background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
  animation:prism 6s linear infinite;
}
@keyframes prism{to{background-position:200% 0}}
.console{position:relative}
.mute{
  position:absolute;top:10px;right:14px;padding:5px 7px;border:0;border-radius:6px;cursor:pointer;
  font-family:var(--font-pixel);font-size:7px;letter-spacing:.08em;color:var(--muted);background:var(--pad);
  box-shadow:inset 0 -2px 0 rgba(0,0,0,.35);touch-action:none;
}
.mute[aria-pressed="true"]{color:#ffd66e}
.mute:focus-visible{outline:2px solid #ffd66e;outline-offset:2px}
.screen{grid-area:screen;background:var(--bezel);padding:12px;border-radius:10px 10px 30px 10px;min-width:0}
canvas{display:block;width:100%;height:auto;aspect-ratio:3/2;image-rendering:pixelated;border-radius:3px;background:#000;outline:none;cursor:pointer}
.dpad{grid-area:dpad;position:relative;width:126px;height:126px;justify-self:start;touch-action:none;margin-left:4px}
.dpad span{position:absolute;background:var(--pad);box-shadow:inset 0 -3px 0 rgba(0,0,0,.35)}
.dpad .up{left:42px;top:0;width:42px;height:46px;border-radius:6px 6px 0 0}
.dpad .down{left:42px;bottom:0;width:42px;height:46px;border-radius:0 0 6px 6px}
.dpad .left{top:42px;left:0;width:46px;height:42px;border-radius:6px 0 0 6px}
.dpad .right{top:42px;right:0;width:46px;height:42px;border-radius:0 6px 6px 0}
.dpad .hub{left:40px;top:40px;width:46px;height:46px;box-shadow:none}
.dpad .up::after,.dpad .down::after,.dpad .left::after,.dpad .right::after{content:"";position:absolute;left:50%;top:50%;border:6px solid transparent;transform:translate(-50%,-50%)}
.dpad .up::after{border-bottom-color:var(--muted);margin-top:-5px}
.dpad .down::after{border-top-color:var(--muted);margin-top:5px}
.dpad .left::after{border-right-color:var(--muted);margin-left:-5px}
.dpad .right::after{border-left-color:var(--muted);margin-left:5px}
.dpad[data-dir="up"] .up,.dpad[data-dir="down"] .down,.dpad[data-dir="left"] .left,.dpad[data-dir="right"] .right{background:var(--pad-on)}
.ab{grid-area:ab;justify-self:end;display:flex;gap:16px;transform:rotate(-22deg);margin-right:6px;touch-action:none}
.btn{
  width:60px;height:60px;border-radius:50%;border:0;cursor:pointer;
  font-family:var(--font-pixel);font-size:14px;color:rgba(255,255,255,.9);
  box-shadow:inset 0 -4px 0 rgba(0,0,0,.3),0 3px 0 rgba(0,0,0,.35);
  touch-action:none;transition:transform .06s;
}
.btn.a{background:var(--btn-a);margin-top:-22px}
.btn.b{background:var(--btn-b)}
.btn.on{transform:scale(.92) translateY(2px)}
.btn:focus-visible,canvas:focus-visible{outline:2px solid #ffd66e;outline-offset:3px}
.hint{grid-area:hint;justify-self:center;font-size:8px;line-height:1.8;color:var(--muted);text-align:center;display:none}
@media (hover:hover) and (pointer:fine){.hint{display:block}}
@media (orientation:landscape) and (max-height:520px){
  .console{
    grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:"dpad screen ab";
    width:min(100%,calc((100dvh - 60px) * 1.5 + 330px));
    padding:12px 16px;border-radius:16px 16px 36px 16px;
  }
  .label,.hint{display:none}
}
@media (prefers-reduced-motion:reduce){.label{animation:none}}
</style>
</head>

function mk(w,h){ const c=document.createElement('canvas'); c.width=w; c.height=h; const g=c.getContext('2d'); g.imageSmoothingEnabled=false; return [c,g]; }
function px(g,c,x,y,w=1,h=1){ g.fillStyle=c; g.fillRect(x,y,w,h); }
function hash(x,y,s=0){ let h=(x*374761393 + y*668265263 + s*982451653)|0; h=(h^(h>>>13))*1274126177|0; return ((h^(h>>>16))>>>0)/4294967296; }

  rows.forEach((r,y)=>{ for(let x=0;x<r.length;x++){ const col=PAL[r[x]]; if(!col) continue; px(g,col,flip?w-1-x:x,y); } });

}
const FRONT = [

const LEGS_F = [["....KSSKKSSK....","....KOOKKOOK...."],["....KSSKKOOK....","....KOOK.KK....."],["....KOOKKSSK....",".....KK.KOOK...."]];
const LEGS_S = [["....KSSKSSK.....","....KOOKOOK....."],["...KSSK.KSSK....","...KOOK..KOOK..."],["...KSSK.KSSK....","...KOOK..KOOK..."]];

function makeBall(d){
  const [c,g]=mk(d,d); const r=d/2;
  for(let y=0;y<d;y++) for(let x=0;x<d;x++){
    const dx=x+.5-r, dy=y+.5-r, dist=Math.hypot(dx,dy); if(dist>r) continue;
    let col = dist>r-1 ? '#221a2e' : Math.abs(dy)<Math.max(.6,d*.07) ? '#221a2e' : dy<0 ? '#e84848' : '#f4f4fa';
    if(dist<d*.2) col = dist<d*.12 ? '#ffffff' : '#221a2e';
    if(dy<-r*.3 && dx<-r*.1 && dist<r-1.5 && dist>r-3.2) col='#ffa0a0';
    px(g,col,x,y);
  }
  return c;
}
const BALL_S = makeBall(10), BALL_L = makeBall(16);

// ---------- mapas ----------
const MAPS = {
  town:{ w:18, h:14, rows:[

const SOLID = new Set(['T','H','S','w','W','M','B','t','p']);

function grass(g,X,Y,x,y){
  px(g,'#84cc62',X,Y,16,16);
  for(let i=0;i<3;i++){ const tx=Math.floor(hash(x,y,i)*13), ty=Math.floor(hash(x,y,i+9)*13);
    px(g,'#62ac48',X+tx,Y+ty+1); px(g,'#62ac48',X+tx+2,Y+ty+1); px(g,'#62ac48',X+tx+1,Y+ty+2); }
}
function path(g,X,Y,x,y){
  px(g,'#ecdfb6',X,Y,16,16);
  for(let i=0;i<4;i++){ px(g,'#d9c896',X+Math.floor(hash(x,y,i)*15),Y+Math.floor(hash(x,y,i+5)*15),2,1); }
}
function flower(g,X,Y,x,y){
  grass(g,X,Y,x,y);
  const spots=[[3,3,'#f27a9c'],[10,9,'#ffffff'],[4,11,'#f27a9c']];
  for(const [fx,fy,c] of spots){ px(g,c,X+fx,Y+fy-1); px(g,c,X+fx-1,Y+fy); px(g,c,X+fx+1,Y+fy); px(g,c,X+fx,Y+fy+1); px(g,'#f8d850',X+fx,Y+fy); }
}
function tree(g,X,Y){
  px(g,'#84cc62',X,Y,16,16);
  for(let yy=12;yy<16;yy++){ px(g,'#221a2e',X+5,Y+yy); px(g,'#7a4a2a',X+6,Y+yy,4,1); px(g,'#221a2e',X+10,Y+yy); }
  const cx=7.5, cy=6.5, rx=7.6, ry=7;
  for(let yy=0;yy<14;yy++) for(let xx=0;xx<16;xx++){
    const d=((xx-cx)/rx)**2+((yy-cy)/ry)**2; if(d>1) continue;
    const s=(xx-cx)+(yy-cy);
    let c = d>.8 ? '#1f4a2a' : s<-4 ? '#72c455' : s>4 ? '#2f7436' : '#4a9a42';
    if(c==='#4a9a42' && (xx+yy)%2===0 && s<-1) c='#72c455';
    if(c==='#4a9a42' && (xx+yy)%2===0 && s>1.5) c='#2f7436';
    px(g,c,X+xx,Y+yy);
  }
}
function water(g,X,Y,x,y,top){

  if(top) px(g,'#3e6cc0',X,Y,16,2);

}

function house(g,X,Y){

  for(const wx of [10,56]){

    px(g,'#ffffff',X+wx+2,Y+39,4,1); px(g,'#221a2e',X+wx+7,Y+38,1,10); px(g,'#221a2e',X+wx+1,Y+43,13,1);
    px(g,'#e8589a',X+wx,Y+49,15,2);
  }
  px(g,'#221a2e',X+33,Y+42,14,22); px(g,'#8a5a34',X+34,Y+43,12,21); px(g,'#6e4426',X+34,Y+43,12,2);
  px(g,'#6e4426',X+39,Y+46,2,15); px(g,'#f8d850',X+43,Y+53,2,2);
  px(g,'#221a2e',X,Y+1,80,32); px(g,'#58a84a',X+1,Y+2,78,29);
  for(let i=0;i<78;i+=4) px(g,'#46903a',X+1+i,Y+2,1,29);
  px(g,'#8ad070',X+1,Y+2,78,2); px(g,'#3a7a30',X+1,Y+28,78,3);
  px(g,'#221a2e',X+28,Y+33,24,8); px(g,'#e8589a',X+29,Y+34,22,6);
  for(const [a,b] of [[32,36],[36,36],[40,36],[44,36],[48,36]]) px(g,'#ffffff',X+a,Y+b,2,2);

function floor(g,X,Y){ px(g,'#d8d0e2',X,Y,16,16); for(const yy of [3,7,11,15]) px(g,'#c2b9d0',X,Y+yy,16,1); }

function machine(g,X,Y,x){

  if(x===0){ px(g,'#221a2e',X+2,Y+2,12,8); px(g,'#5cc8a8',X+3,Y+3,10,6); px(g,'#c8fff0',X+4,Y+4,5,1); px(g,'#c8fff0',X+4,Y+6,7,1); }

function shelf(g,X,Y,x,y){

  const cols=['#e8589a','#58b0e0','#f8d850','#8b76b8','#5cc8a8','#e07040'];

    while(bx<14){ const bw=hash(x,y,bx+sy)>.5?2:1; px(g,cols[Math.floor(hash(x,y,bx*7+sy)*cols.length)],X+bx,Y+sy+(hash(x,y,bx)>.7?1:0),bw,5-(hash(x,y,bx)>.7?1:0)); bx+=bw+ (hash(x,y,bx+2)>.8?1:0); } }

function table(g,X,Y,x,m,y){
  floor(g,X,Y);
  const L=m.rows[y][x-1]!=='t', R=m.rows[y][x+1]!=='t';
  px(g,'#221a2e',X,Y+3,16,11); px(g,'#e2b474',X,Y+4,16,6); px(g,'#b07a40',X,Y+10,16,3);
  if(L){ px(g,'#221a2e',X,Y+3,1,13); px(g,'#e2b474',X+1,Y+4,1,6); px(g,'#8a5a30',X+2,Y+13,2,3); }
  if(R){ px(g,'#221a2e',X+15,Y+3,1,13); px(g,'#8a5a30',X+12,Y+13,2,3); }
}
function plant(g,X,Y){ floor(g,X,Y); px(g,'#221a2e',X+4,Y+9,8,7); px(g,'#c8643c',X+5,Y+10,6,5);

function tone(f,d,{type='square',v=.035,at=0,to=null,t0=null,out=null}={}){

function duck(sec){ if(!ac||!musicOut) return; const g=musicOut.gain, t=ac.currentTime; g.cancelScheduledValues(t); g.setValueAtTime(0,t); g.setValueAtTime(0,t+sec); g.linearRampToValueAtTime(musicOn?1:0,t+sec+.6); }

  const out=[];

    if(song.bass==='walk') out.push([r,2],[r+7,2],[r+12,2],[r+7,2]); else out.push([r,4],[r+7,4]);
  }
  return out;
}

  if(bgm.song===name) return; bgm.song=name; if(!ac) return;
  const t=ac.currentTime+.08; Object.assign(bgm,{li:0,bi:0,lt:t,bt:t,pt:t,bassSeq:name?bassLine(SONGS[name]):null});
}
function hat(t0,v){
  if(!noiseBuf){ noiseBuf=ac.createBuffer(1,ac.sampleRate*.05,ac.sampleRate); const d=noiseBuf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; }
  const s=ac.createBufferSource(), g=ac.createGain(), f=ac.createBiquadFilter(); f.type='highpass'; f.frequency.value=6000;
  s.buffer=noiseBuf; g.gain.setValueAtTime(v,t0); g.gain.exponentialRampToValueAtTime(.0001,t0+.04);
  s.connect(f).connect(g).connect(musicOut); s.start(t0); s.stop(t0+.05);
}
function musicTick(){
  if(!ac||!bgm.song||ac.state!=='running') return; buses();
  const song=SONGS[bgm.song], e=60/song.bpm/2, now=ac.currentTime, ahead=now+.25;
  if(bgm.lt<now-.1){ bgm.lt=bgm.bt=bgm.pt=now+.05; }
  while(bgm.lt<ahead){ const [n,l]=song.lead[bgm.li]; if(n) tone(N(n),l*e*.9,{t0:bgm.lt,v:song.v,out:musicOut}); bgm.lt+=l*e; bgm.li=(bgm.li+1)%song.lead.length; }
  while(bgm.bt<ahead){ const [n,l]=bgm.bassSeq[bgm.bi]; tone(N(n),l*e*.85,{t0:bgm.bt,type:'triangle',v:song.v*2.2,out:musicOut}); bgm.bt+=l*e; bgm.bi=(bgm.bi+1)%bgm.bassSeq.length; }

}

    for(let i=0;i<lines.length;i+=2){ const last=i+2>=lines.length; pages.push({lines:lines.slice(i,i+2),sfx:i===0?o.sfx:null,choice:last?o.choice:null,on:o.on}); } }
  dlg={pages,i:0,shown:0,sel:0,choosing:false,done}; startPage();
}
function startPage(){ const p=dlg.pages[dlg.i]; dlg.shown=0; dlg.sel=0; dlg.choosing=false; if(p.sfx) sfx[p.sfx](); }

// ---------- loop ----------
function update(dt){
  S.t+=dt; player.bump-=dt;
  const want = S.scene==='title' ? 'town' : S.scene==='end' ? (S.endT>3.2?'town':null) : S.map==='lab' ? 'lab' : 'town';
  if(ac && want!==bgm.song) playSong(want);
  musicTick();
  if(trans){
    trans.t+=dt;
    if(!trans.swapped && trans.t>=trans.dur){ trans.swapped=true; trans.mid(); }
    if(trans.t>=trans.dur*2){ const a=trans.after; trans=null; if(a) a(); }
    aQueued=false; pendingDir=null; return;
  }
  const a=aQueued; aQueued=false;
  if(S.scene==='title'){ pendingDir=null; if(a){ sfx.start(); fadeTo(()=>{ S.scene='map'; loadMap('town',9,10,'up'); },()=>say([
      `Que dia bonito, ${PLAYER}!`,
      'Dizem que alguém está esperando por você naquela casa ali em cima...',
      'Use as SETAS para andar e ESPAÇO (ou o botão A) para interagir.'])); }
    return; }
  if(S.scene==='end'){ S.endT+=dt; pendingDir=null; if(a && S.endT>6){ fadeTo(()=>newGame()); } return; }

  if(S.reveal){ S.reveal.t+=dt;
    if(!S.reveal.talked && S.reveal.t>1.9){ S.reveal.talked=true; sfx.cry();
      say(['Saiu um EEVEE!',{t:`${PLAYER} recebeu EEVEE!`,sfx:'jingle'},'EEVEE olhou pra você e abanou o rabinho, todo feliz!',`${PROF}: Que lindo! Agora vem aqui, ${PLAYER}. Tenho uma coisa pra te contar!`],
        ()=>{ S.reveal=null; eevee.on=true; Object.assign(eevee,{x:player.x,y:player.y,fx:player.x,fy:player.y}); }); } }
  if(dlg){ pendingDir=null; const p=dlg.pages[dlg.i]; const L=pageLen(p);
    if(dlg.shown<L) dlg.shown=Math.min(L,dlg.shown+dt*50); else if(p.choice) dlg.choosing=true;
    if(a) advance(); return; }
  if(S.reveal){ pendingDir=null; return; }

  if(player.moving){ player.t+=dt*SPEED; if(player.t>=1){ player.t=1; player.moving=false; arrive(); if(trans) return; } }
  if(!player.moving){
    if(a){ interact(); pendingDir=null; return; }
    const d=held[held.length-1]||pendingDir; pendingDir=null;
    if(d) tryMove(d);
  }
}

  prismBg(S.t);
  text('UM PRESENTE PARA VOCÊ',W/2,16,{color:'#ffe9fb',shadow:'#231836',align:'center'});
  text('A JORNADA',W/2,34,{size:16,color:'#ffffff',shadow:'#e8589a',align:'center'});
  text(`DE ${PLAYER}`,W/2,54,{size:16,color:'#ffffff',shadow:'#e8589a',align:'center'});
  const b=Math.round(Math.abs(Math.sin(S.t*3))*-6);
  ctx.drawImage(SPR.gift,W/2-24,80+b,48,48);
  if(Math.floor(S.t*2)%2===0) text('APERTE A OU ESPAÇO',W/2,140,{color:'#ffe27a',shadow:'#231836',align:'center'});
}
function drawEnd(){
  const t=S.endT; prismBg(S.t);
  text('MISSÃO ACEITA!',W/2,8,{color:'#ffe27a',shadow:'#231836',align:'center'});
  const b=Math.round(Math.abs(Math.sin(S.t*3))*-5);
  ctx.drawImage(SPR.eevee,W/2-24,22+b,48,48);
  for(const [hx,ph] of [[W/2-48,0],[W/2+40,1.5]]){ const hy=40+Math.sin(S.t*2+ph)*5; ctx.drawImage(SPR.heart,Math.round(hx),Math.round(hy),14,12); }
  const lines=['Complete a Pokédex de','Evoluções Prismáticas e','torne-se a maior treinadora','de Eevee da história.'];
  lines.forEach((l,i)=>{ ctx.globalAlpha=Math.max(0,Math.min(1,(t-.6-i*.5)/.4)); text(l,W/2,74+i*11,{color:'#ffffff',shadow:'#231836',align:'center'}); });
  ctx.globalAlpha=Math.max(0,Math.min(1,(t-3)/.5)); text('FIM',W/2,120,{size:16,color:'#ffffff',shadow:'#e8589a',align:'center'});
  ctx.globalAlpha=Math.max(0,Math.min(1,(t-4)/.5)); text(`com carinho, ${FROM}`,W/2,145,{color:'#ffc6e2',shadow:'#231836',align:'center'});
  ctx.globalAlpha=1;
}
function drawReveal(r){
  const t=r.t, cx=W/2, cy=60;
  ctx.fillStyle='rgba(28,18,44,.8)'; ctx.fillRect(0,0,W,H);
  if(t<1.05){ const sh=t>.3?Math.round(Math.sin(t*38)*2):0; ctx.drawImage(BALL_L,cx-24+sh,cy-24,48,48); }
  if(t>=1){
    for(let i=0;i<12;i++){ const a0=i*Math.PI/6+S.t*.6; ctx.fillStyle=`hsla(${i*30+S.t*40},90%,72%,.3)`;
      ctx.beginPath(); ctx.moveTo(cx,cy); ctx.arc(cx,cy,120,a0,a0+.2); ctx.fill(); }
    const k=Math.min(1,(t-1)/.35), c1=1.7, c3=c1+1, e=1+c3*Math.pow(k-1,3)+c1*Math.pow(k-1,2);
    const s=Math.max(0,e)*48, b=k>=1?Math.round(Math.abs(Math.sin(S.t*4))*-3):0;
    ctx.drawImage(SPR.eevee,Math.round(cx-s/2),Math.round(cy-s/2+b),Math.round(s),Math.round(s));
  }
  if(t>.95 && t<1.45){ ctx.fillStyle=`rgba(255,255,255,${1-(t-.95)/.5})`; ctx.fillRect(0,0,W,H); }
}
function lerp(a,b,t){ return a+(b-a)*t; }
function drawMap(){
  const m=MAPS[S.map], k=player.moving?player.t:1;
  const ppx=lerp(player.fx,player.x,k)*TS, ppy=lerp(player.fy,player.y,k)*TS;
  const camX=Math.max(0,Math.min(m.w*TS-W,Math.round(ppx-W/2+8))), camY=Math.max(0,Math.min(m.h*TS-H,Math.round(ppy-H/2+8)));
  ctx.drawImage(m.bg,-camX,-camY);
  if(S.map==='lab' && !S.flags.gotEevee) ctx.drawImage(BALL_S,8*TS+3-camX,4*TS+1-camY);
  const ents=[];
  if(S.map==='lab') ents.push({y:NPC.y*TS,d:()=>ctx.drawImage(SPR.prof,NPC.x*TS-camX,NPC.y*TS-4-camY)});
  if(eevee.on){ const ex=lerp(eevee.fx,eevee.x,k)*TS, ey=lerp(eevee.fy,eevee.y,k)*TS; const hop=player.moving&&(eevee.fx!==eevee.x||eevee.fy!==eevee.y)?Math.round(Math.sin(k*Math.PI)*-2):0;
    ents.push({y:ey-.5,d:()=>ctx.drawImage(SPR.eevee,Math.round(ex-camX),Math.round(ey-3-camY+hop))}); }
  const f=player.moving&&player.t<.5?(player.step?1:2):0;
  ents.push({y:ppy,d:()=>ctx.drawImage(SPR.player[player.dir][f],Math.round(ppx-camX),Math.round(ppy-4-camY))});
  ents.sort((a,b)=>a.y-b.y).forEach(e=>e.d());
  if(S.reveal) drawReveal(S.reveal);
}
function render(){
  resetT(); ctx.clearRect(0,0,W,H);
  if(S.scene==='title') drawTitle(); else if(S.scene==='end') drawEnd(); else drawMap();
  drawDialog();
  if(trans){ const a=trans.t<trans.dur?trans.t/trans.dur:1-(trans.t-trans.dur)/trans.dur; ctx.fillStyle=`rgba(10,6,16,${Math.max(0,Math.min(1,a))})`; ctx.fillRect(0,0,W,H); }
}
let last=performance.now();
function frame(now){ const dt=Math.min(.05,(now-last)/1000); last=now; update(dt); render(); requestAnimationFrame(frame); }
requestAnimationFrame(frame);
try{ cv.focus({preventScroll:true}); }catch(_){}
</script>
